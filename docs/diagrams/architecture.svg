<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" width="980" height="570" role="img" aria-labelledby="t d">
<title id="t">Taskboard architecture</title>
<desc id="d">The task board (port 5500) and the MCP server (port 8001) both call the REST API (port 8190), which stores tasks, the activity log and the MCP API key in SQLite. AI agents connect to the MCP server with the API key. The board asks the MCP server which agents are connected.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M1 1 L8 5 L1 9 Z" fill="#07112a" stroke="#07112a" stroke-width="1.5" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-light" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M1 1 L8 5 L1 9 Z" fill="#ffe08a" stroke="#07112a" stroke-width="1.2" stroke-linejoin="round"/>
  </marker>
</defs>
