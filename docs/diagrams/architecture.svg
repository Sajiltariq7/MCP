<text x="40" y="62" font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-size="30" font-weight="700" fill="#f4f8ff">How the pieces talk</text><text x="40" y="90" font-family="Geist, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" fill="#d2e0fa">One REST API owns the data. People use the board, AI agents use MCP.</text>
